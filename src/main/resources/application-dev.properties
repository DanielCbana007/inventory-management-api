# ---- Perfil DEV ----

# update: Hibernate ajusta el esquema al arrancar segun las entidades.+
spring.jpa.hibernate.ddl-auto=update

# Log del SQL generado, formateado y con los parametros que van en los '?'.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ---- Datos de arranque ----
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Errores completos en las respuestas mientras desarrollas.
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# Swagger UI accesible en http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
