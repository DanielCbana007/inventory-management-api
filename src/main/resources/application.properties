spring.application.name=api

# Perfil que se usa si nadie especifica otro por fuera
# (--spring.profiles.active=prod o SPRING_PROFILES_ACTIVE=prod lo sobrescriben).
spring.profiles.default=dev

# Carga variables desde .env (opcional: si no existe, se usan las del entorno del SO).
spring.config.import=optional:file:.env[.properties]

# ---- Datasource (PostgreSQL) ----
# Las credenciales NUNCA se escriben aqui: vienen de .env o del entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate (comun a todos los perfiles) ----
# open-in-view=false: cierra la sesion de Hibernate al salir del service.
# Fuerza a que el mapeo a DTO ocurra en la capa correcta y evita el N+1 silencioso
# que se dispara al serializar lazy proxies en el controller.
spring.jpa.open-in-view=false

# ---- springdoc / OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
