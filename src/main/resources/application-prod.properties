# ---- Perfil PROD ----
# Prioridad: que la app no toque el esquema, no filtre informacion y no gaste I/O en logs.

# validate: Hibernate compara entidades vs esquema real y falla al arrancar si no cuadran.
spring.jpa.hibernate.ddl-auto=validate

# Nada de SQL en los logs: ruido, coste y riesgo de filtrar datos en los parametros.
spring.jpa.show-sql=false

# data.sql son datos de ejemplo: en prod jamas se ejecuta.
spring.sql.init.mode=never

# ---- Pool de conexiones (HikariCP) ----
# Neon en free tier limita conexiones concurrentes; un pool sin techo las agota.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ---- Respuestas de error ----
# El cliente recibe el contrato del @RestControllerAdvice, nunca detalle interno:
# un stacktrace expone rutas, versiones y estructura de la base.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# ---- OpenAPI ----
# Publicar el contrato completo de la API sin auth es regalar el mapa de ataque.
# Cuando el Proyecto 2 anada Spring Security, la alternativa es dejarlo habilitado
# pero protegido por rol ADMIN.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---- Logging ----
logging.level.root=WARN
logging.level.inventory.management.api=INFO
